<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asynchronous Example</title>
  </head>
  <body data-example="asynchronous">
    <div id="app">
      <div data-react-from-markup-container>
        <div data-rehydratable="AsynchronousRehydrator" data-delay="5000">
          I will rehydrate in 5000ms
        </div>
      </div>
      <div data-react-from-markup-container>
        <div data-rehydratable="AsynchronousRehydrator" data-delay="100">
          I will rehydrate in 100ms
        </div>
      </div>
      <div data-react-from-markup-container>
        <div data-rehydratable="AsynchronousRehydrator" data-delay="10000">
          I will rehydrate in 10000ms
        </div>
      </div>
      <div data-react-from-markup-container>
        <div data-rehydratable="AsynchronousRehydrator" data-delay="2500">
          I will rehydrate in 2500ms
        </div>
      </div>
      <div data-react-from-markup-container>
        <div data-rehydratable="AsynchronousRehydrator" data-delay="500">
          I will rehydrate in 500ms
        </div>
      </div>
      <div data-react-from-markup-container>
        <div data-rehydratable="AsynchronousRehydrator" data-delay="7500">
          I will rehydrate in 7500ms
        </div>
      </div>
    </div>
    <script type="module" src="../main.js"></script>
  </body>
</html>
